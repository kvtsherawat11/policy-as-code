name: Policy as Code CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------
      # 2. Test application
      # ------------------------------------------------
      - name: Test application
        run: |
          python3 -m py_compile app/app.py
          echo "Application syntax check passed."

      # ------------------------------------------------
      # 3. Install OPA
      # ------------------------------------------------
      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # ------------------------------------------------
      # 4. Run Policy as Code
      # ------------------------------------------------
      - name: Run OPA policy check
        run: |
          echo '{"image_tag":"1.0.0"}' > input.json
          opa eval \
            --fail-defined \
            --input input.json \
            --data policies/opa/docker.rego \
            'data.docker.deny[_]'

      # ------------------------------------------------
      # 5. Install Trivy
      # ------------------------------------------------
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      # ------------------------------------------------
      # 6. Set up Docker Buildx
      # ------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------
      # 7. Log in to GHCR
      # ------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------
      # 8. Build Docker image
      # ------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.0.0

      # ------------------------------------------------
      # 9. Build and push image to GHCR
      # ------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.0.0
